parameters:
  # Build Parameters
  - name: buildConfiguration
    default: "Release"
    type: string
  - name: netCoreVersion
    type: string
    default: "8.0.x"

  # The solution (or csproj glob) to build. Building the solution is what
  # makes the SonarQube/SonarCloud scanner see ALL C# projects as one
  # Sonar project. Defaults to the first .slnx in the repo root.
  - name: buildProject
    type: string
    default: "**/*.slnx"

  # List of projects to publish, each becomes its own pipeline artifact.
  # Each entry: { name, project, artifactName }
  #   name         - short identifier, used for staging subdirectory and display names
  #   project      - path/glob to the csproj
  #   artifactName - pipeline artifact name (consumed by the docker job)
  - name: publishProjects
    type: object
    default: []

  # Test Parameters
  - name: executeTests
    type: boolean
    default: false
  - name: testProjects
    type: string
    default: "**/*tests/*.csproj"
  # 'vstest' (default): classic dotnet test / VSTest, coverlet.collector for
  #   coverage (--collect:"XPlat Code Coverage" --logger trx).
  # 'mtp': Microsoft.Testing.Platform-hosted test projects (test projects set
  #   EnableNUnitRunner/EnableMSTestRunner/EnableXUnitRunner + a global.json
  #   `test.runner: Microsoft.Testing.Platform` opt-in). Requires each test
  #   project to reference Microsoft.Testing.Extensions.TrxReport and
  #   Microsoft.Testing.Extensions.CodeCoverage (coverlet.collector doesn't
  #   hook into MTP-hosted runs). VSTest-mode `dotnet test` for MTP apps is a
  #   hard error on .NET 10 SDK with Microsoft.Testing.Platform.MSBuild 2.x
  #   ("no longer supported... on .NET 10 SDK and later"), so there is no
  #   third "bridge" option here -- a repo on .NET 10 SDK with an MTP test
  #   project must use 'mtp'.
  - name: testRunner
    type: string
    default: "vstest"
    values:
      - vstest
      - mtp

  # SonarQube Parameters - a SINGLE scope wraps the solution build,
  # so all C# code reports under one Sonar project.
  - name: executeSonar
    type: boolean
    default: false
  - name: sonarEndpointName
    type: string
    default: ""
  - name: sonarProjectKey
    type: string
    default: ""
  - name: sonarProjectName
    type: string
    default: ""
  - name: useSonarCloud
    type: boolean
    default: false
  - name: sonarCloudOrganization
    type: string
    default: ""
  - name: sonarExtraProperties
    type: string
    default: ""

  # Hooks
  - name: prebuildSteps
    type: stepList
    default: []
  - name: preTestSteps
    type: stepList
    default: []

  - name: externalFeedCredentials
    type: string
    default: "SpydersoftGithub"

  # Path to nuget.config. Defaults to the repo root, but some repos keep it
  # elsewhere (e.g. a monorepo where nuget.config lives under a shared src/
  # directory rather than the checkout root).
  - name: nugetConfigPath
    type: string
    default: "$(Build.SourcesDirectory)/nuget.config"

steps:
  - task: UseDotNet@2
    displayName: "Use .NET Core sdk"
    inputs:
      packageType: sdk
      version: ${{ parameters.netCoreVersion }}

  - ${{ if eq(parameters.executeSonar, true) }}:
      - ${{ if eq(parameters.useSonarCloud, true) }}:
          - task: SonarCloudPrepare@3
            inputs:
              SonarCloud: ${{ parameters.sonarEndpointName }}
              organization: ${{ parameters.sonarCloudOrganization }}
              scannerMode: "dotnet"
              projectKey: ${{ parameters.sonarProjectKey }}
              projectName: ${{ parameters.sonarProjectName }}
              # Emitted unconditionally for both testRunner modes: coverlet
              # (vstest) writes coverage.opencover.xml, Microsoft.Testing.
              # Extensions.CodeCoverage (mtp) only supports coverage/xml/
              # cobertura output, not opencover, so it writes
              # coverage.cobertura.xml instead (see the "Copy Test Files" step
              # below). Only the glob matching real files contributes; the
              # other is a harmless no-op for whichever mode isn't in use.
              extraProperties: |
                sonar.cs.opencover.reportsPaths="$(Agent.TempDirectory)/ResultFiles/**/coverage.opencover.xml"
                sonar.cs.cobertura.reportsPaths="$(Agent.TempDirectory)/ResultFiles/**/coverage.cobertura.xml"
                ${{ parameters.sonarExtraProperties }}
      - ${{ else }}:
          - task: SonarQubePrepare@5
            inputs:
              SonarQube: ${{ parameters.sonarEndpointName }}
              scannerMode: "MSBuild"
              projectKey: ${{ parameters.sonarProjectKey }}
              projectName: ${{ parameters.sonarProjectName }}
              extraProperties: |
                sonar.cs.opencover.reportsPaths="$(Agent.TempDirectory)/ResultFiles/**/coverage.opencover.xml"
                sonar.cs.cobertura.reportsPaths="$(Agent.TempDirectory)/ResultFiles/**/coverage.cobertura.xml"
                ${{ parameters.sonarExtraProperties }}

  - ${{ parameters.prebuildSteps }}

  - task: DotNetCoreCLI@2
    displayName: "DotNet restore packages (dotnet restore)"
    inputs:
      command: "restore"
      feedsToUse: config
      nugetConfigPath: ${{ parameters.nugetConfigPath }}
      projects: "**/*.csproj"
      externalFeedCredentials: ${{ parameters.externalFeedCredentials }}

  - task: DotNetCoreCLI@2
    displayName: Build solution (dotnet build)
    inputs:
      command: build
      projects: ${{ parameters.buildProject }}
      arguments: "--no-restore --configuration ${{ parameters.buildConfiguration }} /p:InformationalVersion=$(fullSemVer) /p:AssemblyVersion=$(AssemblySemVer) /p:AssemblyFileVersion=$(AssemblySemFileVer)"

  - ${{ if eq(parameters.executeTests, true) }}:
      - ${{ parameters.preTestSteps }}

      - ${{ if eq(parameters.testRunner, 'vstest') }}:
          - task: DotNetCoreCLI@2
            displayName: Test (dotnet test)
            inputs:
              command: test
              projects: ${{ parameters.testProjects }}
              publishTestResults: false
              # Run --no-build: the solution build above already compiled the test
              # projects (they are part of buildProject, same assumption the
              # --no-build publish below relies on). Rebuilding here would happen
              # WITHOUT the version props, regenerating AssemblyInfo at the default
              # 1.0.0.0 and clobbering the test project's transitive deps (e.g.
              # Core/Data) in the shared bin; a --no-build publish of an app outside
              # the test graph (e.g. an API) would then ship those deps at 1.0.0.0
              # next to a correctly-versioned entry assembly and fail to load them
              # at runtime. --no-build keeps every assembly at the single version
              # stamped by the solution build (and is faster).
              arguments: '--no-build --no-restore --configuration ${{ parameters.buildConfiguration }} --collect:"XPlat Code Coverage" --logger trx --results-directory "$(Agent.TempDirectory)"'
      - ${{ else }}:
          # MTP mode: still plain `dotnet test` via the same task -- the repo's own
          # global.json (test.runner: Microsoft.Testing.Platform) is what switches
          # `dotnet test` itself into MTP's native CLI, so only the arguments need to
          # change, not the invocation mechanism. VSTest-flavored flags like
          # --collect:"XPlat Code Coverage" / --logger trx are replaced with MTP's own
          # --coverage / --report-trx.
          #
          # --coverage-output is a literal filename (no placeholder support), so every
          # matched project/TFM would write the same "coverage.cobertura.xml" name --
          # but each is still a separate `dotnet test <project>` process (the task
          # invokes one per project the testProjects glob matches), and MTP gives each
          # of those its own machine+timestamp-named results subfolder, so they don't
          # collide even sharing one --results-directory. The Copy Test Files step
          # below dedupes MTP's per-run duplicate (it writes the same report to two
          # paths under that folder).
          - task: DotNetCoreCLI@2
            displayName: Test (dotnet test)
            inputs:
              command: test
              projects: ${{ parameters.testProjects }}
              publishTestResults: false
              arguments: '--no-build --no-restore --configuration ${{ parameters.buildConfiguration }} --report-trx --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml --results-directory "$(Agent.TempDirectory)"'

      - pwsh: |
          Push-Location $(Agent.TempDirectory);
          if (Test-Path "ResultFiles")
          {
              Remove-Item "ResultFiles" -Recurse -Force;
          }
          $null = New-Item -ItemType Directory -Path "ResultFiles";
          $resultFilesPath = Join-Path (Get-Location) "ResultFiles";

          # Legacy layout (pre-.NET 10 SDK 10.0.300, and current vstest/coverlet):
          # coverage attachments organized into {trxname}/In/{machine}/coverage.*.xml
          # alongside the trx file.
          $copiedLegacy = $false;
          $trxFiles = Get-ChildItem *.trx -Recurse;
          foreach ($trxFile in $trxFiles)
          {
              $trxFileName = [System.IO.Path]::GetFileNameWithoutExtension($trxFile);
              $copyPath = [System.IO.Path]::Combine($trxFile.Directory, $trxFileName);

              Write-Host "Processing $copyPath";
              if (Test-Path $copyPath)
              {
                  $destDir = Join-Path $resultFilesPath ([guid]::NewGuid());
                  $null = New-Item -ItemType Directory -Path $destDir;
                  Copy-Item $copyPath $destDir -Recurse;
                  $copiedLegacy = $true;
              }
          }

          # New layout (.NET 10 SDK 10.0.300+ / Microsoft.Testing.Platform): coverage
          # attachments can sit at any depth under each run's results directory (e.g.
          # mtp's own <user>_<machine>_<timestamp>/In/<machine>/coverage.*.xml, or
          # flat alongside the trx) -- search recursively rather than assume a fixed
          # depth. Only fall back to this if the legacy layout wasn't found, to avoid
          # duplicating results when both exist.
          #
          # mtp writes the SAME report to two paths under one run folder (a flat copy
          # plus a nested VSTest-compatible copy) -- take only the shallowest match per
          # run folder, or PublishCodeCoverageResults would ingest each run's coverage
          # twice.
          if (-not $copiedLegacy)
          {
              $runDirs = Get-ChildItem -Directory | Where-Object { $_.Name -ne 'ResultFiles' };
              foreach ($runDir in $runDirs)
              {
                  $file = Get-ChildItem -Path $runDir.FullName -Filter 'coverage.*.xml' -File -Recurse -ErrorAction SilentlyContinue |
                      Sort-Object { ($_.FullName -split '\\').Count } |
                      Select-Object -First 1;
                  if ($file)
                  {
                      Write-Host "Processing $($file.FullName)";
                      $destDir = Join-Path $resultFilesPath ([guid]::NewGuid());
                      $null = New-Item -ItemType Directory -Path $destDir;
                      Copy-Item $file.FullName $destDir;
                  }
              }
          }

          Pop-Location;
        displayName: Copy Test Files

      - task: PublishTestResults@2
        inputs:
          testResultsFormat: "VSTest"
          # Recursive: vstest mode writes trx flat into Agent.TempDirectory; mtp mode
          # (see Test (Microsoft.Testing.Platform) step above) writes each run's trx into
          # its own per-run subdirectory. ResultFiles/ never contains a *.trx copy (only
          # coverage.*.xml / coverage folders), so this can't double-count results.
          testResultsFiles: "$(Agent.TempDirectory)/**/*.trx"

      - task: PublishCodeCoverageResults@2
        condition: true # always try publish coverage results, even if unit tests fail
        inputs:
          summaryFileLocation: "$(Agent.TempDirectory)/ResultFiles/**/coverage.cobertura.xml"

  - ${{ if eq(parameters.executeSonar, true) }}:
      - ${{ if eq(parameters.useSonarCloud, true) }}:
          - task: SonarCloudAnalyze@3
            inputs:
              jdkversion: "JAVA_HOME_17_X64"
          - task: SonarCloudPublish@3
            inputs:
              pollingTimeoutSec: "300"
      - ${{ else }}:
          - powershell: |
              $params = "$env:SONARQUBE_SCANNER_PARAMS" -replace '"sonar.branch.name":"[\w,/,-]*"\,?'
              Write-Host "##vso[task.setvariable variable=SONARQUBE_SCANNER_PARAMS]$params"
            displayName: Replace branch name
          - task: SonarQubeAnalyze@5
          - task: SonarQubePublish@5
            inputs:
              pollingTimeoutSec: "300"

  # Publish each container's csproj to its own staging subdirectory, then
  # upload as a separate pipeline artifact. --no-build reuses the solution
  # build above, so each container reflects the exact bits Sonar scanned.
  # This depends on NOTHING recompiling after the versioned solution build
  # (the test step above is also --no-build) so every assembly carries the
  # single AssemblyVersion stamped by that build; otherwise a recompile
  # without the version props would stamp deps at 1.0.0.0 and the app would
  # fail to load them at runtime (FileNotFoundException: '<dep>, Version=...').
  - ${{ each pub in parameters.publishProjects }}:
      - task: DotNetCoreCLI@2
        displayName: "Publish ${{ pub.name }} (dotnet publish)"
        inputs:
          command: publish
          # publishWebProjects defaults to true and, when true, the task ignores
          # the `projects` input and auto-globs for web-SDK csprojs. We need our
          # explicit per-image project to win, so disable it.
          publishWebProjects: false
          projects: ${{ pub.project }}
          arguments: "--no-build --no-restore --configuration ${{ parameters.buildConfiguration }} --output $(Build.ArtifactStagingDirectory)/${{ pub.name }} /p:InformationalVersion=$(fullSemVer) /p:AssemblyVersion=$(AssemblySemVer) /p:AssemblyFileVersion=$(AssemblySemFileVer)"
          zipAfterPublish: True
      - publish: "$(Build.ArtifactStagingDirectory)/${{ pub.name }}"
        artifact: "${{ pub.artifactName }}"
        displayName: "Upload ${{ pub.name }} artifact"
