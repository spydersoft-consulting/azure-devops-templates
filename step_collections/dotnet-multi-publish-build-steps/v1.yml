parameters:
  # Build Parameters
  - name: buildConfiguration
    default: "Release"
    type: string
  - name: netCoreVersion
    type: string
    default: "8.0.x"

  # The solution (or csproj glob) to build. Building the solution is what
  # makes the SonarQube/SonarCloud scanner see ALL C# projects as one
  # Sonar project. Defaults to the first .slnx in the repo root.
  - name: buildProject
    type: string
    default: "**/*.slnx"

  # List of projects to publish, each becomes its own pipeline artifact.
  # Each entry: { name, project, artifactName }
  #   name         - short identifier, used for staging subdirectory and display names
  #   project      - path/glob to the csproj
  #   artifactName - pipeline artifact name (consumed by the docker job)
  - name: publishProjects
    type: object
    default: []

  # Test Parameters
  - name: executeTests
    type: boolean
    default: false
  - name: testProjects
    type: string
    default: "**/*tests/*.csproj"
  # See README.md#test-runner-modes.
  - name: testRunner
    type: string
    default: "vstest"
    values:
      - vstest
      - mtp

  # SonarQube Parameters - a SINGLE scope wraps the solution build,
  # so all C# code reports under one Sonar project.
  - name: executeSonar
    type: boolean
    default: false
  - name: sonarEndpointName
    type: string
    default: ""
  - name: sonarProjectKey
    type: string
    default: ""
  - name: sonarProjectName
    type: string
    default: ""
  - name: useSonarCloud
    type: boolean
    default: false
  - name: sonarCloudOrganization
    type: string
    default: ""
  - name: sonarExtraProperties
    type: string
    default: ""

  # Hooks
  - name: prebuildSteps
    type: stepList
    default: []
  - name: preTestSteps
    type: stepList
    default: []

  - name: externalFeedCredentials
    type: string
    default: "SpydersoftGithub"

  # Path to nuget.config. Defaults to the repo root, but some repos keep it
  # elsewhere (e.g. a monorepo where nuget.config lives under a shared src/
  # directory rather than the checkout root).
  - name: nugetConfigPath
    type: string
    default: "$(Build.SourcesDirectory)/nuget.config"

steps:
  - task: UseDotNet@2
    displayName: "Use .NET Core sdk"
    inputs:
      packageType: sdk
      version: ${{ parameters.netCoreVersion }}

  - ${{ if eq(parameters.executeSonar, true) }}:
      - ${{ if eq(parameters.useSonarCloud, true) }}:
          - task: SonarCloudPrepare@3
            inputs:
              SonarCloud: ${{ parameters.sonarEndpointName }}
              organization: ${{ parameters.sonarCloudOrganization }}
              scannerMode: "dotnet"
              projectKey: ${{ parameters.sonarProjectKey }}
              projectName: ${{ parameters.sonarProjectName }}
              # Both reportsPaths cover the two testRunner modes -- see README.md#test-runner-modes.
              extraProperties: |
                sonar.cs.opencover.reportsPaths="$(Agent.TempDirectory)/ResultFiles/**/coverage.opencover.xml"
                sonar.cs.cobertura.reportsPaths="$(Agent.TempDirectory)/ResultFiles/**/coverage.cobertura.xml"
                ${{ parameters.sonarExtraProperties }}
      - ${{ else }}:
          - task: SonarQubePrepare@5
            inputs:
              SonarQube: ${{ parameters.sonarEndpointName }}
              scannerMode: "MSBuild"
              projectKey: ${{ parameters.sonarProjectKey }}
              projectName: ${{ parameters.sonarProjectName }}
              extraProperties: |
                sonar.cs.opencover.reportsPaths="$(Agent.TempDirectory)/ResultFiles/**/coverage.opencover.xml"
                sonar.cs.cobertura.reportsPaths="$(Agent.TempDirectory)/ResultFiles/**/coverage.cobertura.xml"
                ${{ parameters.sonarExtraProperties }}

  - ${{ parameters.prebuildSteps }}

  - task: DotNetCoreCLI@2
    displayName: "DotNet restore packages (dotnet restore)"
    inputs:
      command: "restore"
      feedsToUse: config
      nugetConfigPath: ${{ parameters.nugetConfigPath }}
      projects: "**/*.csproj"
      externalFeedCredentials: ${{ parameters.externalFeedCredentials }}

  - task: DotNetCoreCLI@2
    displayName: Build solution (dotnet build)
    inputs:
      command: build
      projects: ${{ parameters.buildProject }}
      arguments: "--no-restore --configuration ${{ parameters.buildConfiguration }} /p:InformationalVersion=$(fullSemVer) /p:AssemblyVersion=$(AssemblySemVer) /p:AssemblyFileVersion=$(AssemblySemFileVer)"

  - ${{ if eq(parameters.executeTests, true) }}:
      - ${{ parameters.preTestSteps }}

      - ${{ if eq(parameters.testRunner, 'vstest') }}:
          - task: DotNetCoreCLI@2
            displayName: Test (dotnet test)
            inputs:
              command: test
              projects: ${{ parameters.testProjects }}
              publishTestResults: false
              # --no-build: reuses the versioned solution build above -- see
              # README.md#implementation-notes.
              arguments: '--no-build --no-restore --configuration ${{ parameters.buildConfiguration }} --collect:"XPlat Code Coverage" --logger trx --results-directory "$(Agent.TempDirectory)"'
      - ${{ else }}:
          # mtp mode -- see README.md#test-runner-modes. DotNetCoreCLI@2's `command: test`
          # always shells out to `MSBuild --target:VSTest` regardless of `arguments`
          # (that's how the task implements command: test), which doesn't recognize
          # MTP-native flags at all ("MSB1001: Unknown switch" on --report-trx). Call the
          # dotnet CLI directly instead -- global.json's `test.runner` opt-in is what
          # makes plain `dotnet test` use MTP, and that only works through the real CLI.
          - pwsh: |
              $ErrorActionPreference = "Stop";
              # testProjects is an ADO/minimatch-style glob, which PowerShell -Path
              # doesn't parse the same way the DotNetCoreCLI task does -- find test
              # projects by their own IsTestProject marker instead.
              $csprojFiles = Get-ChildItem -Path . -Recurse -Filter *.csproj -File -ErrorAction SilentlyContinue |
                  Where-Object { (Get-Content $_.FullName -Raw) -match '<IsTestProject>\s*true\s*</IsTestProject>' };

              $hadFailure = $false;
              foreach ($csproj in $csprojFiles)
              {
                  # One `dotnet test --test-modules` invocation per built TFM assembly, each
                  # with its own guaranteed-unique results directory. A single `dotnet test
                  # <csproj>` call runs every targeted TFM in parallel, and --coverage-output
                  # is a fixed filename -- MTP's own results-subfolder naming for that isn't
                  # reliably collision-free under that parallelism (observed one dropped
                  # report out of several TFMs sharing a directory), so give each run its own
                  # directory instead of trusting MTP's.
                  $binRoot = Join-Path $csproj.Directory.FullName "bin/${{ parameters.buildConfiguration }}";
                  $testDlls = Get-ChildItem -Path $binRoot -Filter "$($csproj.BaseName).dll" -Recurse -File -ErrorAction SilentlyContinue;
                  foreach ($testDll in $testDlls)
                  {
                      $runResultsDir = Join-Path $(Agent.TempDirectory) ([guid]::NewGuid());
                      $null = New-Item -ItemType Directory -Path $runResultsDir -Force;

                      # --test-modules matches against --root-directory (defaults to the
                      # working directory) as a pattern -- an absolute path silently matches
                      # nothing ("No test modules found"), even one under that same root.
                      $relativeDllPath = [System.IO.Path]::GetRelativePath((Get-Location), $testDll.FullName);
                      & dotnet test --test-modules $relativeDllPath --no-build --no-restore --report-trx --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml --results-directory $runResultsDir;
                      if ($LASTEXITCODE -ne 0) { $hadFailure = $true; }
                  }
              }

              if ($hadFailure) { exit 1; }
            displayName: Test (dotnet test)

      - pwsh: |
          Push-Location $(Agent.TempDirectory);
          if (Test-Path "ResultFiles")
          {
              Remove-Item "ResultFiles" -Recurse -Force;
          }
          $null = New-Item -ItemType Directory -Path "ResultFiles";
          $resultFilesPath = Join-Path (Get-Location) "ResultFiles";

          # vstest/coverlet layout: coverage attachments organized into
          # {trxname}/In/{machine}/coverage.*.xml alongside the trx file.
          $copiedLegacy = $false;
          $trxFiles = Get-ChildItem *.trx -Recurse;
          foreach ($trxFile in $trxFiles)
          {
              $trxFileName = [System.IO.Path]::GetFileNameWithoutExtension($trxFile);
              $copyPath = [System.IO.Path]::Combine($trxFile.Directory, $trxFileName);

              Write-Host "Processing $copyPath";
              if (Test-Path $copyPath)
              {
                  $destDir = Join-Path $resultFilesPath ([guid]::NewGuid());
                  $null = New-Item -ItemType Directory -Path $destDir;
                  Copy-Item $copyPath $destDir -Recurse;
                  $copiedLegacy = $true;
              }
          }

          # mtp layout: each run (see "Test (dotnet test)" above -- one per built TFM
          # assembly, each with its own results directory) writes its report to two paths:
          # a flat copy, and a nested "<run>/In/<machine>/coverage.*.xml" copy. Match only
          # the nested one -- it's the unique, non-duplicate copy.
          if (-not $copiedLegacy)
          {
              $files = Get-ChildItem -Path . -Filter 'coverage.*.xml' -File -Recurse -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match '\\In\\[^\\]+\\coverage\.[^\\]+\.xml$' };
              foreach ($file in $files)
              {
                  Write-Host "Processing $($file.FullName)";
                  $destDir = Join-Path $resultFilesPath ([guid]::NewGuid());
                  $null = New-Item -ItemType Directory -Path $destDir;
                  Copy-Item $file.FullName $destDir;
              }
          }

          Pop-Location;
        displayName: Copy Test Files

      - task: PublishTestResults@2
        inputs:
          testResultsFormat: "VSTest"
          # Recursive to cover both testRunner modes -- see README.md#test-runner-modes.
          testResultsFiles: "$(Agent.TempDirectory)/**/*.trx"

      - task: PublishCodeCoverageResults@2
        condition: true # always try publish coverage results, even if unit tests fail
        inputs:
          summaryFileLocation: "$(Agent.TempDirectory)/ResultFiles/**/coverage.cobertura.xml"

  - ${{ if eq(parameters.executeSonar, true) }}:
      - ${{ if eq(parameters.useSonarCloud, true) }}:
          - task: SonarCloudAnalyze@3
            inputs:
              jdkversion: "JAVA_HOME_17_X64"
          - task: SonarCloudPublish@3
            inputs:
              pollingTimeoutSec: "300"
      - ${{ else }}:
          - powershell: |
              $params = "$env:SONARQUBE_SCANNER_PARAMS" -replace '"sonar.branch.name":"[\w,/,-]*"\,?'
              Write-Host "##vso[task.setvariable variable=SONARQUBE_SCANNER_PARAMS]$params"
            displayName: Replace branch name
          - task: SonarQubeAnalyze@5
          - task: SonarQubePublish@5
            inputs:
              pollingTimeoutSec: "300"

  # Publishes each publishProjects entry to its own staging subdirectory and pipeline
  # artifact, reusing the solution build above (--no-build) -- see
  # README.md#implementation-notes.
  - ${{ each pub in parameters.publishProjects }}:
      - task: DotNetCoreCLI@2
        displayName: "Publish ${{ pub.name }} (dotnet publish)"
        inputs:
          command: publish
          publishWebProjects: false # let `projects` (below) pick the project, not an auto-glob
          projects: ${{ pub.project }}
          arguments: "--no-build --no-restore --configuration ${{ parameters.buildConfiguration }} --output $(Build.ArtifactStagingDirectory)/${{ pub.name }} /p:InformationalVersion=$(fullSemVer) /p:AssemblyVersion=$(AssemblySemVer) /p:AssemblyFileVersion=$(AssemblySemFileVer)"
          zipAfterPublish: True
      - publish: "$(Build.ArtifactStagingDirectory)/${{ pub.name }}"
        artifact: "${{ pub.artifactName }}"
        displayName: "Upload ${{ pub.name }} artifact"
